name: auto-merge

# Squash-merges automation PRs as soon as CI is green — no manual click, no review.
#
# Policy (per repo owner): every PR whose head branch is named `claude/*` is merged
# automatically once the `tests` workflow passes. CI is the only gate. PRs on any
# other branch (manual work) are never touched. Drafts are flipped to ready first so
# the bot's draft PRs still merge.
#
# It runs off the `tests` workflow's completion (workflow_run) rather than on the PR
# directly, so it only ever fires after the unit suite has actually finished and gone
# green for that exact commit.

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only act on a SUCCESSFUL tests run that was triggered by a pull request FROM THIS
    # REPOSITORY. workflow_run fires in the base repo for fork PRs too, with this job's
    # write token, and `head_branch` is whatever the fork named it — so without the
    # head_repository check a stranger could name a fork branch claude/anything, carry
    # their own green tests, and get squash-merged into main (which Netlify deploys).
    # Found by the 2026-09 security audit; the same-repo check closes it.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge passing claude/* PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Gate on the branch-name convention — every automation PR uses claude/*.
          case "$HEAD_BRANCH" in
            claude/*) ;;
            *) echo "Branch '$HEAD_BRANCH' is not claude/* — leaving it alone."; exit 0 ;;
          esac

          # Find the open PR for this branch (workflow_run doesn't carry the PR number
          # reliably for all events, but head_branch is always present).
          # Match on the exact head commit the green run was for, and never a cross-repo
          # PR — `--head` alone matches by branch NAME, which a fork can share.
          num=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open \
                  --json number,headRefOid,isCrossRepository \
                  --jq "[.[] | select(.isCrossRepository == false and .headRefOid == \"$HEAD_SHA\")] | .[0].number // empty")
          if [ -z "$num" ]; then
            echo "No open PR for '$HEAD_BRANCH' — nothing to merge."
            exit 0
          fi

          # Flip a draft to ready so it can merge (the bot opens PRs as drafts).
          if [ "$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "PR #$num is a draft — marking ready for review."
            gh pr ready "$num" --repo "$GITHUB_REPOSITORY"
          fi

          echo "Squash-merging PR #$num ($HEAD_BRANCH)…"

          # NOT-MERGEABLE-YET IS THE EXPECTED CASE, NOT A FAILURE — AND IT MUST NOT
          # GO RED. Several agents work different problems in parallel here, so every
          # branch bumps APP_VERSION and adds its changelog row against whatever main
          # was when it started. Whichever branch merges first moves both lines, and
          # the others are then conflicted on the version alone — never on feature
          # code. The branch rebases, CI goes green again, and THIS job merges it.
          # Wholly self-healing, and the comment that used to sit here already said
          # so ("that's fine — the next green CI run on the branch will retry").
          #
          # But `gh pr merge` exits non-zero, `set -e` failed the job, and GitHub
          # mailed "Run failed: auto-merge - main" every time. In the 41 hours to
          # 2026-09-11 03:09 UTC, 11 of the repo's 18 red runs were THIS and nothing
          # else — roughly one in four auto-merge runs that did any work — which
          # buried the 7 real `tests` failures in the same pile of red. An alert that
          # is usually wrong teaches you to stop reading the channel, and it takes
          # the real ones down with it.
          #
          # So: swallow ONLY the two not-mergeable messages. Every other failure — a
          # bad token, a revoked permission, branch protection, an API outage — still
          # fails the job loudly, because none of those fix themselves.
          if merge_out=$(gh pr merge "$num" --repo "$GITHUB_REPOSITORY" --squash --delete-branch 2>&1); then
            echo "$merge_out"
            echo "Merged PR #$num." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$merge_out"

          case "$merge_out" in
            # "Pull Request has merge conflicts" (a real conflict) and "is not
            # mergeable: the merge commit cannot be cleanly created" (GitHub has not
            # finished computing mergeability, or the same conflict by another name).
            *"merge conflicts"*|*"not mergeable"*)
              # A GREEN RUN THAT DID NOT MERGE MUST STILL SAY SO. Exiting 0 silently
              # would report an intent as an outcome — the run page would look like a
              # merge happened. The notice and the step summary put "did not merge,
              # and why" on the run itself, where it can be read without an email.
              echo "::notice::PR #$num is not mergeable yet (version bump needs rebasing onto main). Left open — the next green run on $HEAD_BRANCH will merge it."
              {
                echo "### Not merged — PR #$num"
                echo ""
                echo "\`$HEAD_BRANCH\` is not mergeable against main yet. This is the"
                echo "expected parallel-branch case: rebase the version bump and the"
                echo "changelog row, and the next green CI run merges it automatically."
                echo ""
                echo "\`\`\`"
                echo "$merge_out"
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          echo "::error::gh pr merge failed for PR #$num, and not because of a merge conflict — this one needs a person."
          exit 1
