name: auto-merge

# Squash-merges automation PRs as soon as CI is green — no manual click, no review.
#
# Policy (per repo owner): every PR whose head branch is named `claude/*` is merged
# automatically once the `tests` workflow passes. CI is the only gate. PRs on any
# other branch (manual work) are never touched. Drafts are flipped to ready first so
# the bot's draft PRs still merge.
#
# It runs off the `tests` workflow's completion (workflow_run) rather than on the PR
# directly, so it only ever fires after the unit suite has actually finished and gone
# green for that exact commit.

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only act on a SUCCESSFUL tests run that was triggered by a pull request FROM THIS
    # REPOSITORY. workflow_run fires in the base repo for fork PRs too, with this job's
    # write token, and `head_branch` is whatever the fork named it — so without the
    # head_repository check a stranger could name a fork branch claude/anything, carry
    # their own green tests, and get squash-merged into main (which Netlify deploys).
    # Found by the 2026-09 security audit; the same-repo check closes it.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge passing claude/* PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Gate on the branch-name convention — every automation PR uses claude/*.
          case "$HEAD_BRANCH" in
            claude/*) ;;
            *) echo "Branch '$HEAD_BRANCH' is not claude/* — leaving it alone."; exit 0 ;;
          esac

          # Find the open PR for this branch (workflow_run doesn't carry the PR number
          # reliably for all events, but head_branch is always present).
          # Match on the exact head commit the green run was for, and never a cross-repo
          # PR — `--head` alone matches by branch NAME, which a fork can share.
          num=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open \
                  --json number,headRefOid,isCrossRepository \
                  --jq "[.[] | select(.isCrossRepository == false and .headRefOid == \"$HEAD_SHA\")] | .[0].number // empty")
          if [ -z "$num" ]; then
            echo "No open PR for '$HEAD_BRANCH' — nothing to merge."
            exit 0
          fi

          # Flip a draft to ready so it can merge (the bot opens PRs as drafts).
          if [ "$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "PR #$num is a draft — marking ready for review."
            gh pr ready "$num" --repo "$GITHUB_REPOSITORY"
          fi

          echo "Squash-merging PR #$num ($HEAD_BRANCH)…"
          # If it isn't mergeable yet (e.g. a conflict), this exits non-zero; that's
          # fine — the next green CI run on the branch will retry.
          gh pr merge "$num" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
