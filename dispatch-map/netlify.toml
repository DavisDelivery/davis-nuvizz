# Build: a plain `npm run build` against the LOCKFILE. The shared quote console
# (@davisdelivery/quote-generator) is pinned in package-lock.json to a specific
# Quotes commit, and that pin is what ships. The build used to prepend
# `npm i @davisdelivery/quote-generator@github:DavisDelivery/Quotes#main --no-save`
# so every deploy tracked the branch head — which meant code nobody in this repo
# had reviewed was pulled at build time into a process holding every server
# secret in env (FIREBASE_SA, the NuVizz credentials, the mail and SMS keys). A
# push to that branch, or a compromise of that repo, was a push to production
# here. To take a newer Quotes release: bump the lockfile pin in a reviewed PR.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  [functions."nuvizz-pull-today-stops"]
    timeout = 26
  [functions."nuvizz-manual-scan"]
    timeout = 26
  # The write endpoint needs headroom for the LOAD IMPORT path (load read + per-stop reads +
  # the import + its quick convergence check). The Netlify DEFAULT is 10s, which killed the
  # first live import Save mid-flight before anything landed.
  [functions."nuvizz-write"]
    timeout = 26
  # The bottom-grid "pull from NuVizz" explorer: a wide window (±14/±30 days, or a custom
  # range) can take NuVizz several seconds to answer. The 10s DEFAULT let a large ±7d pull
  # overrun and get killed with an HTML 502 the client couldn't parse ("Unexpected token
  # '<'"). Give it the same 26s headroom as the other NuVizz functions; the handler aborts
  # at 22s and returns a clean JSON error. Still the cheap 2-call list path (no re-scan).
  [functions."nuvizz-stop-explorer"]
    timeout = 26
  # The two LIVE-BOARD engine endpoints (driver drafts and end-of-night cleanup).
  # Both are Firestore-only — ZERO NuVizz calls — but a dispatcher is waiting on a
  # real assignment solve over a whole unplanned pool. On the 10s DEFAULT a busy
  # evening would be killed mid-solve and answer an HTML 502 the client cannot
  # parse (the same failure the stop explorer and the write path hit above). The
  # cores also bound their own local search (LIVE_SOLVER_MS), so this headroom is
  # the outer belt, not the plan.
  [functions."routing-draft"]
    timeout = 26
  [functions."routing-cleanup"]
    timeout = 26
  [functions."motive-driver-positions"]
    timeout = 10
  # "Check email now" on the Manifest check tab: one poll of every configured
  # mailbox (list + a get per unseen message + an attachment download) plus the free
  # board diff, which reads a full day's stop index out of Firestore. Comfortably
  # under 10s on a normal night, but a slow Firestore list on a 700-stop day would be
  # killed at the DEFAULT with an HTML 502 the client can't parse. The ingest caps
  # itself per mailbox, so this stays a click — the every-30-min background poll is
  # where a real backlog gets worked off.
  [functions."manifest-email-check"]
    timeout = 26
  # Uline forecast: GET is Firestore + blobs; POST reads the forecast mailbox (a batch of up to
  # 12 spreadsheets on a backfill press, ~1–2s each). The 10s default kills that mid-batch as
  # an HTML 502 the client cannot parse; the loop also stops itself at 18s and says so.
  [functions."uline-forecast"]
    timeout = 26
  # The customer delivery-email pre-flight. Both are Firestore-only (ZERO NuVizz calls) but
  # both read WIDE: ?coverage=1 lists a full day's stop index and then reads one
  # customer_notes doc per delivered stop, and ?days=30 on the log walks 30 per-day send
  # subcollections. Comfortably under 10s on a normal day, but the DEFAULT would kill a slow
  # Firestore list with an HTML 502 the client cannot parse — the same failure that bit the
  # stop explorer. Both are click-driven and self-bounded (the coverage sample is capped).
  [functions."customer-comms-test"]
    timeout = 26
  [functions."customer-comms-log"]
    timeout = 26
  # The ETA back-test replays the arrival model over the sealed history warehouse: one
  # day is ~65 routes and ~800 stops read out of Firestore, and a multi-day window is that
  # again per day. Read-only, Firestore-only, ZERO NuVizz calls. On the 10s DEFAULT a
  # single day squeaked through but a 4-week window died at 502 mid-replay, which reads as
  # "no data" rather than "ran out of time" — the same trap the stop explorer hit.
  [functions."eta-backtest"]
    timeout = 26
  # The flag replay simulates a full day of 20-minute alert sweeps over one sealed day —
  # ~39 engine runs over ~800 stops plus the same Firestore reads the live sweep makes.
  # One day per request BY DESIGN (a runner loops dates); the 10s default is too tight
  # for the notes fan-out on a big board. Read-only, ZERO NuVizz calls, never sends.
  [functions."flag-replay"]
    timeout = 26
  # The departure refit reads up to 30 sealed days out of the history warehouse to fit each
  # route's real start time. Read-only, Firestore-only, ZERO NuVizz calls. The 10s default
  # dies partway through a multi-week scan, which reads as "no routes learned" rather than
  # "ran out of time" — the same trap the back-test and the replay hit.
  [functions."route-departures"]
    timeout = 26
  # The nightly miss ledger scores a sealed day: a full day's stop index plus one
  # customer_notes read per distinct customer, and a BACKFILL walks up to 60 of those.
  # It is declared -background, so it gets Netlify's 15-minute allowance and needs no
  # timeout override; this note exists so nobody adds one and caps a backfill at 26s.
  # The critical-flag alert reads a full day's stop index plus one customer_notes doc per
  # distinct customer. Declared -background for the 15-minute allowance; no override wanted.
  # "What would the alert do?" — reads a day's stop index plus a customer_notes doc per
  # distinct customer. Same wide-Firestore shape as customer-comms-test, same 26s.
  [functions."eta-flag-check"]
    timeout = 26
  # The manifest archive, read back: a 30-day window is one Firestore get per day, and the
  # ?pdf=1 path streams a report out of the blob store. Read-only, ZERO NuVizz calls. A
  # 180-day window on the 10s default would die partway and read as "no history" rather than
  # "ran out of time" — the same trap the back-test, the replay and the departure fit hit.
  [functions."manifest-history"]
    timeout = 26
  # Scanned-manifest OCR runs as manifest-ocr-BACKGROUND (vision over a multi-page fax
  # PDF takes 20-40s — over the 26s request cap that killed the synchronous version).
  # Background functions get Netlify's 15-min allowance; no timeout override needed.

# Response headers for everything the site serves. No full Content-Security-Policy — the
# app loads Google Maps, Firebase and fonts from several origins and a wrong CSP takes the
# map down; frame-ancestors alone stops the app being framed (clickjacking) without touching
# what the page itself may load. HSTS one year + subdomains; nosniff; a referrer policy that
# keeps the ?date=/&stopNbr= query strings off third-party logs.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"

# The customer-facing unsubscribe. MUST sit above the SPA catch-all below: Netlify takes the
# FIRST matching rule, so without this "/unsubscribe" would be served index.html and the
# customer would get the dispatch app instead of a way off the mailing list.
[[redirects]]
  from = "/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
