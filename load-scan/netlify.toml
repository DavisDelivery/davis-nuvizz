# load-scan — dock/loadout scanning app (Netlify site: ddsloadout).
#
# This repo is a monorepo: the root and dispatch-map/ each deploy to their own
# Netlify site. `base` pins THIS site to the load-scan/ subtree, so Netlify reads
# this file (not the root netlify.toml) and builds only this package.
#
# With `base` set, `publish` and `functions` below are resolved RELATIVE TO the
# base directory — i.e. load-scan/dist and load-scan/netlify/functions.
[build]
  base = "load-scan"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# A call to a function that ISN'T deployed must not fall through to the SPA
# catch-all below — that answers HTTP 200 with index.html, and the caller's
# res.json() then dies on "Unexpected token '<'" instead of surfacing the real
# problem (exactly the failure dispatch-map hit on nuvizz-stop-explorer).
# Netlify matches real functions BEFORE redirects, so this only catches names
# that genuinely aren't deployed — and answers them as JSON, with a 404.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/function-not-found.json"
  status = 404

# SPA fallback: every remaining path serves index.html so client routing works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
