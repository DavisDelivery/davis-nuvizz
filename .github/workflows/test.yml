name: tests

# Runs the pure routing solver unit suite (node --test). Until now the only CI
# signal was Netlify's deploy checks, which never execute these tests — so a
# regression in the solver (e.g. the Phase 3 growth-guard spill) could merge
# unnoticed. This job gates push/PR on the full suite.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The solver/repair libs and their tests import only local .mts modules and
      # node: builtins, so Node 22's native TypeScript stripping runs them with no
      # install step. `npm test` == `node --test "test/**/*.test.mjs"`.
      - run: npm test

  # ── load-scan ─────────────────────────────────────────────────────────────
  # The dock scanner's suite covers the rules a driver depends on at 5am: PIN
  # hashing and lockout, token forgery, alias and sign-in resolution, the
  # NuVizz field-semantics translation, scan-ingest idempotency and wedge
  # capture. None of it ran here — the job above is pinned to dispatch-map — so
  # auto-merge was gating claude/* PRs on a suite that never opened this
  # subtree. Same no-install shape as `unit`: these tests import only local
  # modules (.js and Node-22-strippable .mts) and node: builtins.
  unit-load-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: load-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  # ── Does the SCANNER actually start? ───────────────────────────────────────
  # Same gap as `smoke` below, in the app that matters most at 5am. load-scan had
  # 211 unit tests and not one that mounts the app: a blank-screen deploy — the
  # exact v0.54.14 failure dispatch-map already shipped once — would have gone out
  # green. `npm run lint` here is a stub too, so nothing else was watching.
  # Needs an install and a browser, so it cannot ride along on the no-install
  # `unit-load-scan` job above.
  smoke-load-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: load-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: load-scan/package-lock.json
      - run: npm ci
      # Browser revision is read from the RESOLVED playwright-core so it always matches
      # the library that drives it; a hardcoded version silently drifts on a lockfile bump.
      - run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install chromium
      - run: npm run build
      - run: npm run smoke
      # The phantom-piece regression proof: scripted camera frames through the
      # REAL bundle — one aim must book ONE piece (dock incident of Aug 12),
      # and a piece id arriving late must upgrade its fallback, not double it.
      - run: npm run e2e:camera

  # ── Does the app actually START? ───────────────────────────────────────────
  # v0.54.14 shipped a bundle that was blank on every device: state declared in
  # RoutingScreen and read in Shell threw `driversPanelOpen is not defined` on the
  # first render, React unmounted the tree, white screen. CI was green and could not
  # have been otherwise — it is a RUNTIME error the bundler cannot see, `npm run lint`
  # is a stub, and none of the unit tests above mount the app. A passing build says
  # nothing about whether the app starts.
  #
  # This job builds the real bundle, serves it, loads it in headless Chromium at phone
  # size, and fails on any uncaught startup error or an empty #root. Verified BOTH ways
  # against the actual broken v0.54.14 bundle (fails, naming the identifier) and the
  # fixed one (passes). Separate job so the fast no-install `unit` gate is unchanged.
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatch-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dispatch-map/package-lock.json
      - run: npm ci
      # playwright-core ships no browser; fetch just chromium. The CLI version is read
      # from the RESOLVED playwright-core so the browser revision always matches the
      # library that will drive it — a hardcoded version silently drifts on a lockfile
      # bump and then fails to find its browser.
      - run: npx --yes playwright@$(node -p "require('playwright-core/package.json').version") install chromium
      - run: npm run build
      - run: npm run smoke
      # THE PHONE GUARD. It walks every screen at 390 and 360, opens the sheets and
      # drawers, and fails on content wider than the screen, controls clipped out of their
      # container, sub-40px tap targets and dead regions. It shipped at v0.54.80 described
      # as build-gating and then was never wired to anything — every claim that it "fails
      # the build" was false until this line existed. Chromium is already installed above.
      - run: npm run verify:mobile
      # The desktop counterpart — a screen can be perfect at 390px and still waste half a
      # dispatcher's 1920px monitor, and no phone check can see that.
      - run: npm run verify:desktop
      # "Hide place labels" can only misbehave on a build that HAS a cloud mapId: Google
      # ignores the JS `styles` array on those maps, so the toggle had nothing to do on the
      # roadmap base. Honouring it means REBUILDING the map without the mapId, and the risk
      # that creates is invisible to a unit test — a rebind that misses would leave the
      # dispatcher on a clean map with no pins on it. So rebuild with a stub id and drive
      # the real toggle, on both the Map and the Routing screen.
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ci-test-key
          VITE_GOOGLE_MAP_ID: ci-test-map-id
      - run: npm run verify:hide-labels
