# load-scan — dock/loadout scanning app (Netlify site: ddsloadout).
#
# This repo is a monorepo: the root and dispatch-map/ each deploy to their own
# Netlify site. `base` pins THIS site to the load-scan/ subtree, so Netlify reads
# this file (not the root netlify.toml) and builds only this package.
#
# With `base` set, `publish` and `functions` below are resolved RELATIVE TO the
# base directory — i.e. load-scan/dist and load-scan/netlify/functions.
[build]
  base = "load-scan"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # The seeding report walks up to 30 day-partitions of the stop index (~600 stops
  # each) to collect distinct driver aliases. Netlify's 10s DEFAULT kills it part
  # way through and the dispatcher gets a truncated table with no warning, so give
  # it the same 26s headroom the NuVizz-facing functions get on the other sites.
  # Still zero NuVizz calls — this is Firestore reads only.
  [functions."driver-alias-report"]
    timeout = 26
  # A queued flush after a long dead zone can carry a few hundred scans.
  [functions."scan-session"]
    timeout = 26

# SPA fallback: every non-asset path serves index.html so client routing works.
#
# CAVEAT, measured on this site — a call to a function that ISN'T deployed also
# lands here, so it answers HTTP 200 with text/html instead of a 404. Netlify
# runs Compute (functions) before Static routing (redirects), and a redirect
# scoped to "/.netlify/functions/*" does NOT take precedence — we deployed one
# and unknown function names still fell through to this rule. So the guard has
# to live in the client: see fetchJson() in src/App.jsx, which rejects a
# non-JSON content-type rather than letting res.json() die on "Unexpected
# token '<'" (the failure dispatch-map hit on nuvizz-stop-explorer).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every response. The function helpers already send nosniff
# and a referrer policy on JSON, but the HTML shell and the hashed assets were
# going out bare. No full Content-Security-Policy yet: the camera engine loads
# Quagga from jsdelivr, and a CSP that blocks it breaks scanning outright —
# frame-ancestors alone stops the app being framed without touching that.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
