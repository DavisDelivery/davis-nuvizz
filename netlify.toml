[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Pro plan: bump sync function timeout from 10s to 26s (max allowed).
  # Needed for __fleet and __driver which scan ~150 load numbers in parallel against NuVizz.
  [functions."nuvizz"]
    timeout = 26
  [functions."dispatch"]
    timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline browser hardening on every response. No full Content-Security-Policy —
# Leaflet tiles/CSS from jsdelivr, Google Maps and Firebase all load cross-origin and a
# strict CSP written blind would blank the app; frame-ancestors alone is safe and closes
# clickjacking together with X-Frame-Options.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
